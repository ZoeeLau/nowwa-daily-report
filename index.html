    const esc = function(s) { return String(s).replace(/[&<>]/g, function(m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]; }); };
    const sign = function(s) { s = String(s); return s.charAt(0) === '+' ? 1 : (s.charAt(0) === '-' ? -1 : 0); };
    const change = function(s) { const n = sign(s); return '<span class="change ' + (n > 0 ? 'pos' : (n < 0 ? 'neg' : '')) + '">' + esc(s) + '</span>'; };
    const colorize = function(s) {
      return esc(s).replace(/([+-][0-9]+(?:[.][0-9]+)?(?:%|元))/g, function(m) {
        return '<span class="' + (m.charAt(0) === '+' ? 'pos' : 'neg') + '">' + m + '</span>';
      });
    };
    function bar(n, max, isMain) {
      const width = Math.max(4, n / max * 100).toFixed(1);
      return '<div class="bar"><i style="width:' + width + '%;background:' + (isMain ? 'var(--orange)' : 'var(--blue)') + '"></i></div>';
    }
    function overviewCard(x) {
      return '<article class="overview-card"><h3>' + esc(x.name) + '</h3><div class="note">' + esc(x.note || '') + '</div>' +
        '<div class="hero-label">杯量</div><div class="hero-value">' + esc(x.cups) + '</div>' +
        '<div class="compare"><span>日 ' + change(x.day) + '</span><span>周 ' + change(x.week) + '</span><span>VS8月 ' + change(x.vs) + '</span></div>' +
        '<div class="mini-grid"><div class="mini"><strong>动销店日均 ' + esc(x.active) + '</strong>日 ' + change(x.activeDay) + '<br>周 ' + change(x.activeWeek) +
        '</div><div class="mini"><strong>日均动销门店 ' + esc(x.stores) + '</strong>日 ' + change(x.storesDay) + '<br>周 ' + change(x.storesWeek) + '</div></div>' +
        '<div class="metric-line"><strong>杯均实收 ' + esc(x.receipt) + '</strong>日 ' + change(x.receiptDay) + '　周 ' + change(x.receiptWeek) + '　VS8月 ' + change(x.receiptVs) + '</div>' +
        '<div class="metric-line"><strong>杯均利润 ' + esc(x.profit) + '</strong>日 ' + change(x.profitDay) + '　周 ' + change(x.profitWeek) + '</div></article>';
    }
    function summaryCard(name, item, isRegion) {
      const labels = isRegion ? ['大区整体：','下钻 A/B/C：','杯均利润：'] : ['整体：','下钻 A/B/C：','杯均利润：'];
      return '<article class="summary-card' + (isRegion ? ' region-card' : '') + '"><h3>' + esc(name) + '</h3>' +
        '<p><b>' + labels[0] + '</b>' + colorize(item.overall) + '</p>' +
        '<p><b>' + labels[1] + '</b>' + colorize(item.menus) + '</p>' +
        '<p><b>' + labels[2] + '</b>' + colorize(item.profit) + '</p></article>';
    }
    function channelTable(metric) {
      const max = Math.max.apply(null, metric.rows.reduce(function(a, r) { return a.concat([r[1][1], r[2][1]]); }, []));
      let h = '<div class="metric-block"><div class="metric-header">' + esc(metric.label) + '</div><table><colgroup>' +
        '<col style="width:15%"><col style="width:12%"><col style="width:25%"><col style="width:16%"><col style="width:16%">' +
        (metric.vs ? '<col style="width:16%">' : '') + '</colgroup><thead><tr><th>菜单</th><th>口径</th><th>数值</th><th>日环比</th><th>周同比</th>' +
        (metric.vs ? '<th>VS8月</th>' : '') + '</tr></thead><tbody>';
      metric.rows.forEach(function(row) {
        const menu = row[0], total = row[1], main = row[2];
        h += '<tr class="pair-start"><td rowspan="2" class="menu">' + esc(menu) + '</td><td class="scope">整体</td><td class="value">' + esc(total[0]) + bar(total[1], max, false) + '</td><td>' + change(total[2]) + '</td><td>' + change(total[3]) + '</td>' + (metric.vs ? '<td>' + change(total[4]) + '</td>' : '') + '</tr>';
        h += '<tr><td class="scope main">主站</td><td class="value">' + esc(main[0]) + bar(main[1], max, true) + '</td><td>' + change(main[2]) + '</td><td>' + change(main[3]) + '</td>' + (metric.vs ? '<td>' + change(main[4]) + '</td>' : '') + '</tr>';
      });
      return h + '</tbody></table></div>';
    }
    function regionTable(key, label, hasVs) {
      const values = DATA.regionData.reduce(function(a, r) { return a.concat(r[key].map(function(x) { return x[2]; })); }, []);
      const max = Math.max.apply(null, values);
      const cols = hasVs
        ? '<col style="width:14%"><col style="width:14%"><col style="width:28%"><col style="width:14%"><col style="width:15%"><col style="width:15%">'
        : '<col style="width:15%"><col style="width:15%"><col style="width:30%"><col style="width:20%"><col style="width:20%">';
      let h = '<div class="region-metric metric-block region-table"><div class="metric-header">' + esc(label) + '</div><table><colgroup>' + cols + '</colgroup><thead><tr><th>大区</th><th>菜单</th><th>数值</th><th>日环比</th><th>周同比</th>' + (hasVs ? '<th>VS8月</th>' : '') + '</tr></thead><tbody>';
      DATA.regionData.forEach(function(r) {
        r[key].forEach(function(v, i) {
          h += '<tr class="' + (i === 0 ? 'pair-start' : '') + '">' + (i === 0 ? '<td rowspan="4" class="region">' + esc(r.name) + '</td>' : '') +
            '<td class="menu">' + esc(v[0]) + '</td><td class="value">' + esc(v[1]) + bar(v[2], max, false) + '</td><td>' + change(v[3]) + '</td><td>' + change(v[4]) + '</td>' + (hasVs ? '<td>' + change(v[5]) + '</td>' : '') + '</tr>';
        });
      });
      return h + '</tbody></table></div>';
    }
    document.getElementById('overview').innerHTML = DATA.overview.map(overviewCard).join('');
    document.getElementById('channel-summary').innerHTML = DATA.channelData.map(function(c) { return summaryCard(c.name, DATA.channelSummaries[c.name], false); }).join('');
    document.getElementById('channel-details').innerHTML = DATA.channelData.map(function(c) {
      return '<section class="detail-channel"><div class="detail-heading"><h3>' + esc(c.name) + '</h3><span>先看整体，再看分菜单与主站</span></div>' + c.metrics.map(channelTable).join('') + '</section>';
    }).join('');
    document.getElementById('region-summary-cards').innerHTML = DATA.regionData.map(function(r) { return summaryCard(r.name, DATA.regionSummaries[r.name], true); }).join('');
    document.getElementById('region-details').innerHTML = regionTable('volume','杯量',true) + regionTable('receipt','杯均实收',true) + regionTable('profit','杯均利润',false);
