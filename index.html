<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>外卖新菜单经营日报｜2026-09-04</title>
  <style>
    :root { --ink:#172b4d; --muted:#64748b; --bg:#f3f6f9; --card:#fff; --line:#dfe7ef; --blue:#315d8a; --orange:#dd873c; --pos:#cf3237; --neg:#148262; }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; }
    .page { width:100%; max-width:1440px; margin:0 auto; padding:28px 32px 48px; }
    .header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; }
    .header h1 { font-size:34px; margin:0 0 3px; font-weight:900; letter-spacing:.2px; }
    .sub,.date { color:var(--muted); font-size:15px; font-weight:700; }
    .header-tools { display:flex; align-items:flex-start; justify-content:flex-end; gap:12px; }
    .header-actions { display:flex; gap:8px; }
    .action-btn { min-height:36px; padding:0 13px; border:1px solid #b7c8d9; border-radius:7px; background:#fff; color:#274968; cursor:pointer; font:800 14px/1 "Microsoft YaHei","PingFang SC",Arial,sans-serif; white-space:nowrap; }
    .action-btn:hover { border-color:var(--blue); background:#eef4f8; }
    .action-btn:disabled { opacity:.62; cursor:wait; }
    .date { text-align:right; }
    .date strong { display:block; color:var(--ink); font-size:26px; margin-bottom:3px; }
    .summary-main { padding:20px 24px; background:#e8eff6; border:1px solid #dae5ee; border-radius:12px; }
    .summary-main p { margin:0; font-size:22px; line-height:1.75; font-weight:800; }
    .pos { color:var(--pos); }
    .neg { color:var(--neg); }
    .section { margin-top:30px; }
    .section-title { display:flex; align-items:center; gap:11px; font-size:29px; margin:0 0 13px; font-weight:900; }
    .index { padding:5px 9px; border-radius:6px; background:var(--blue); color:#fff; font-size:17px; }
    .summary-rule { margin:0 0 14px; padding:12px 16px; border:1px solid #d9e5ee; border-radius:9px; background:#f8fafc; color:#42566f; font-size:15px; line-height:1.65; font-weight:700; }
    .overview-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; }
    .overview-card,.summary-card,.metric-block,.good,.bad { background:var(--card); border:1px solid var(--line); border-radius:11px; }
    .overview-card { padding:15px; border-top:4px solid var(--blue); box-shadow:0 1px 2px #172b4d0a; }
    .overview-card h3 { margin:0 0 2px; font-size:20px; }
    .note { height:16px; color:var(--muted); font-size:12px; }
    .hero-label { margin-top:11px; color:var(--muted); font-size:14px; font-weight:700; }
    .hero-value { font-size:29px; line-height:1.25; font-weight:900; }
    .compare { display:flex; justify-content:space-between; gap:6px; margin-top:9px; font-size:14px; font-weight:800; }
    .compare span { white-space:nowrap; }
    .mini-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .mini,.metric-line { border-radius:8px; background:#f6f8fa; font-size:12px; line-height:1.65; font-weight:800; }
    .mini { padding:8px; }
    .mini strong,.metric-line strong { display:block; font-size:15px; }
    .metric-line { margin-top:9px; padding:9px 10px; }
    .metric-line strong { font-size:16px; }
    .channel-summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
    .region-summary,.region-cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:14px; }
    .summary-card { padding:16px 18px; }
    .summary-card h3 { margin:0 0 8px; font-size:21px; }
    .summary-card p { margin:7px 0 0; font-size:16px; line-height:1.65; font-weight:700; }
    .summary-card p:first-of-type { margin-top:0; }
    .region-card { border-top:4px solid var(--blue); }
    .good,.bad { padding:17px 20px; }
    .good { border-left:5px solid var(--neg); }
    .bad { border-left:5px solid var(--pos); }
    .good h3,.bad h3 { margin:0 0 8px; font-size:21px; }
    .good p,.bad p { margin:0; font-size:16px; line-height:1.75; font-weight:700; }
    .detail-channel { margin:20px 0 32px; }
    .detail-heading { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
    .detail-heading h3 { margin:0; font-size:25px; }
    .detail-heading span { color:var(--muted); font-size:14px; font-weight:700; }
    .metric-block { margin-top:14px; overflow:hidden; }
    .metric-header { padding:11px 16px; border-left:5px solid var(--blue); background:#eef4f8; font-size:20px; font-weight:900; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    thead { background:#f6f8fa; }
    th { padding:10px 9px; color:#526579; text-align:center; font-size:14px; font-weight:800; }
    td { padding:9px; border-top:1px solid #edf1f4; text-align:center; vertical-align:middle; font-size:16px; font-weight:700; }
    tbody tr.pair-start td { border-top:1px solid #dfe7ef; }
    .menu,.region { padding-left:18px; text-align:left; font-size:17px; font-weight:900; }
    .scope { text-align:left; white-space:nowrap; font-size:14px; }
    .scope::before { content:""; display:inline-block; width:9px; height:9px; margin-right:7px; border-radius:2px; background:var(--blue); }
    .scope.main::before { background:var(--orange); }
    .value { font-size:17px; font-weight:900; }
    .bar { height:5px; margin-top:6px; overflow:hidden; border-radius:10px; background:#e9eef2; }
    .bar i { display:block; height:100%; border-radius:10px; }
    .change { white-space:nowrap; }
    .region-metric { margin-top:18px; }
    .region-table .menu { font-weight:700; }
    .footnote { margin-top:24px; color:var(--muted); font-size:14px; line-height:1.7; }
    @media (max-width:1120px) { .overview-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .channel-summary { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:840px) {
      .page { padding:16px 12px; }
      .header { display:block; }
      .header h1 { font-size:27px; }
      .header-tools { justify-content:flex-start; flex-wrap:wrap; margin-top:10px; }
      .date { text-align:left; }
      .summary-main p { font-size:17px; }
      .overview-grid,.channel-summary,.region-summary,.region-cards { grid-template-columns:1fr; }
      .metric-block { overflow-x:auto; }
      .metric-block table { min-width:720px; }
      .region-table table { min-width:760px; }
    }
  </style>
</head>

      metric.rows.forEach(function(row) {
        const menu = row[0], total = row[1], main = row[2];
        h += '<tr class="pair-start"><td rowspan="2" class="menu">' + esc(menu) + '</td><td class="scope">整体</td><td class="value">' + esc(total[0]) + bar(total[1], max, false) + '</td><td>' + change(total[2]) + '</td><td>' + change(total[3]) + '</td>' + (metric.vs ? '<td>' + change(total[4]) + '</td>' : '') + '</tr>';
        h += '<tr><td class="scope main">主站</td><td class="value">' + esc(main[0]) + bar(main[1], max, true) + '</td><td>' + change(main[2]) + '</td><td>' + change(main[3]) + '</td>' + (metric.vs ? '<td>' + change(main[4]) + '</td>' : '') + '</tr>';
      });
      return h + '</tbody></table></div>';
    }
    function regionTable(key, label, hasVs) {
      const values = DATA.regionData.reduce(function(a, r) { return a.concat(r[key].map(function(x) { return x[2]; })); }, []);
      const max = Math.max.apply(null, values);
      const cols = hasVs
        ? '<col style="width:14%"><col style="width:14%"><col style="width:28%"><col style="width:14%"><col style="width:15%"><col style="width:15%">'
        : '<col style="width:15%"><col style="width:15%"><col style="width:30%"><col style="width:20%"><col style="width:20%">';
      let h = '<div class="region-metric metric-block region-table"><div class="metric-header">' + esc(label) + '</div><table><colgroup>' + cols + '</colgroup><thead><tr><th>大区</th><th>菜单</th><th>数值</th><th>日环比</th><th>周同比</th>' + (hasVs ? '<th>VS8月</th>' : '') + '</tr></thead><tbody>';
      DATA.regionData.forEach(function(r) {
        r[key].forEach(function(v, i) {
          h += '<tr class="' + (i === 0 ? 'pair-start' : '') + '">' + (i === 0 ? '<td rowspan="4" class="region">' + esc(r.name) + '</td>' : '') +
            '<td class="menu">' + esc(v[0]) + '</td><td class="value">' + esc(v[1]) + bar(v[2], max, false) + '</td><td>' + change(v[3]) + '</td><td>' + change(v[4]) + '</td>' + (hasVs ? '<td>' + change(v[5]) + '</td>' : '') + '</tr>';
        });
      });
      return h + '</tbody></table></div>';
    }
    document.getElementById('overview').innerHTML = DATA.overview.map(overviewCard).join('');
    document.getElementById('channel-summary').innerHTML = DATA.channelData.map(function(c) { return summaryCard(c.name, DATA.channelSummaries[c.name], false); }).join('');
    document.getElementById('channel-details').innerHTML = DATA.channelData.map(function(c) {
      return '<section class="detail-channel"><div class="detail-heading"><h3>' + esc(c.name) + '</h3><span>先看整体，再看分菜单与主站</span></div>' + c.metrics.map(channelTable).join('') + '</section>';
    }).join('');
    document.getElementById('region-summary-cards').innerHTML = DATA.regionData.map(function(r) { return summaryCard(r.name, DATA.regionSummaries[r.name], true); }).join('');
    document.getElementById('region-details').innerHTML = regionTable('volume','杯量',true) + regionTable('receipt','杯均实收',true) + regionTable('profit','杯均利润',false);

    function saveBlob(blob, filename) {
      var link = document.createElement('a');
      var url = URL.createObjectURL(blob);
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
    }

    function downloadHtml() {
      var content = '<!doctype html>\n' + document.documentElement.outerHTML;
      saveBlob(new Blob([content], {type:'text/html;charset=utf-8'}), '外卖新菜单经营日报_2026-09-04.html');
    }

    function pageStyleText() {
      return Array.prototype.map.call(document.querySelectorAll('style'), function(node) { return node.textContent; }).join('\n');
    }

    async function downloadImage() {
      var button = document.getElementById('download-image');
      var originalText = button.textContent;
      button.disabled = true;
      button.textContent = '正在生成…';
      try {
        if (document.fonts && document.fonts.ready) { await document.fonts.ready; }
        var target = document.querySelector('.page');
        var clone = target.cloneNode(true);
        var actions = clone.querySelector('.header-actions');
        if (actions) { actions.remove(); }
        var rect = target.getBoundingClientRect();
        var width = Math.ceil(rect.width);
        var height = Math.ceil(target.scrollHeight);
        var scale = Math.min(2, 16000 / Math.max(1, height), 8000 / Math.max(1, width));
        var markup = '<div xmlns="http://www.w3.org/1999/xhtml" class="export-surface"><style>' + pageStyleText() + '.export-surface{width:' + width + 'px;min-height:' + height + 'px;background:#f3f6f9;overflow:hidden;}</style>' + clone.outerHTML + '</div>';
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '"><foreignObject width="100%" height="100%">' + markup + '</foreignObject></svg>';
        var svgUrl = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml;charset=utf-8'}));
        var image = new Image();
        image.onload = function() {
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(width * scale));
          canvas.height = Math.max(1, Math.round(height * scale));
          var context = canvas.getContext('2d');
          context.fillStyle = '#f3f6f9';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.setTransform(scale, 0, 0, scale, 0, 0);
          context.drawImage(image, 0, 0);
          URL.revokeObjectURL(svgUrl);
          if (canvas.toBlob) {
            canvas.toBlob(function(blob) {
              if (!blob) {
                window.alert('图片导出失败，请使用 Chrome 或 Edge 后重试。');
                button.disabled = false;
                button.textContent = originalText;
                return;
              }
              saveBlob(blob, '外卖新菜单经营日报_2026-09-04.png');
              button.disabled = false;
              button.textContent = originalText;
            }, 'image/png');
          } else {
            var dataUrl = canvas.toDataURL('image/png');
            var link = document.createElement('a');
            link.href = dataUrl;
            link.download = '外卖新菜单经营日报_2026-09-04.png';
            link.click();
            button.disabled = false;
            button.textContent = originalText;
          }
        };
        image.onerror = function() {
          URL.revokeObjectURL(svgUrl);
          window.alert('图片导出失败，请使用 Chrome 或 Edge 后重试。');
          button.disabled = false;
          button.textContent = originalText;
        };
        image.src = svgUrl;
      } catch (error) {
        window.alert('图片导出失败，请使用 Chrome 或 Edge 后重试。');
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    document.getElementById('download-html').addEventListener('click', downloadHtml);
    document.getElementById('download-image').addEventListener('click', downloadImage);
  </script>
</body>
</html>
