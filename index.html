    .neg { color:var(--neg); }

    .channel-summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
    .region-summary,.region-cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:14px; }

    .good,.bad { padding:17px 20px; }

    .bad { border-left:5px solid var(--pos); }

    .metric-block { margin-top:14px; overflow:hidden; }
    .metric-header { padding:11px 16px; border-left:5px solid var(--blue); background:#eef4f8; font-size:20px; font-weight:900; }

    .value { font-size:17px; font-weight:900; }
    .bar { height:5px; margin-top:6px; overflow:hidden; border-radius:10px; background:#e9eef2; }
    .bar i { display:block; height:100%; border-radius:10px; }
    .change { white-space:nowrap; }

    .footnote { margin-top:24px; color:var(--muted); font-size:14px; line-height:1.7; }

        "饿了么": {overall:"杯量日环比 -2.28%、周同比 +10.10%、VS8月 +4.87%。",menus:"A菜单日 -1.40%、周 +11.45%、VS8月 -1.71%；B菜单日 -6.17%、周 +5.82%、VS8月 +8.63%；C菜单日 -2.45%、周 +10.59%、VS8月 +11.24%。"},
        "美团": {overall:"杯量日环比 -4.09%、周同比 -8.73%、VS8月 -21.78%。",menus:"A菜单日 -3.45%、周 -8.92%、VS8月 -24.13%；B菜单日 -6.14%、周 -15.93%、VS8月 -26.58%；C菜单日 -4.90%、周 -6.39%、VS8月 -17.78%。"},
        "京东": {overall:"杯量日环比 -3.00%、周同比 +22.66%、VS8月 +0.86%。",menus:"A菜单日 -4.51%、周 +26.10%、VS8月 +3.43%；B菜单日 -7.87%、周 +12.81%、VS8月 +3.14%；C菜单日 -1.49%、周 +25.80%、VS8月 +1.80%。"}
      },
      regionSummaries: {
        "华东": {overall:"杯量日环比 -2.30%、周同比 +7.42%、VS8月 -7.16%。",menus:"A菜单日 -1.23%、周 +4.60%、VS8月 -3.66%；B菜单日 -4.04%、周 +17.69%、VS8月 +7.45%；C菜单日 -3.65%、周 +7.68%、VS8月 -7.22%。"},
        "华北": {overall:"杯量日环比 -4.25%、周同比 -8.21%、VS8月 -17.00%。",menus:"A菜单日 -8.41%、周 -8.08%、VS8月 -25.26%；B菜单日 -8.15%、周 -3.77%、VS8月 -7.91%；C菜单日 +0.47%、周 -10.63%、VS8月 -16.00%。"},
        "华南": {overall:"杯量日环比 -1.44%、周同比 +18.48%、VS8月 +0.83%。",menus:"A菜单日 -1.09%、周 +16.49%、VS8月 +7.97%；B菜单日 -1.75%、周 +16.12%、VS8月 +13.76%；C菜单日 -1.92%、周 +20.25%、VS8月 +7.81%。"},
        "江苏": {overall:"杯量日环比 -7.07%、周同比 +1.04%、VS8月 -11.09%。",menus:"A菜单日 -4.62%、周 +1.35%、VS8月 -10.05%；B菜单日 -6.78%、周 +0.71%、VS8月 -3.03%；C菜单日 -8.32%、周 +1.71%、VS8月 -3.93%。"},
        "西部": {overall:"杯量日环比 -4.74%、周同比 -3.86%、VS8月 -2.64%。",menus:"A菜单日 -4.75%、周 -5.80%、VS8月 -22.05%；B菜单日 -7.75%、周 -11.60%、VS8月 -14.61%；C菜单日 -2.84%、周 +1.81%、VS8月 -5.01%。"},
        "闽赣": {overall:"杯量日环比 -3.71%、周同比 +8.61%、VS8月 -13.02%。",menus:"A菜单日 -1.36%、周 +10.33%、VS8月 -11.39%；B菜单日 -2.47%、周 +0.25%、VS8月 -16.81%；C菜单日 -6.58%、周 +7.08%、VS8月 -6.72%。"}
      }
    };

    const esc = function(s) { return String(s).replace(/[&<>]/g, function(m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]; }); };
    const sign = function(s) { s = String(s); return s.charAt(0) === '+' ? 1 : (s.charAt(0) === '-' ? -1 : 0); };
    const change = function(s) { const n = sign(s); return '<span class="change ' + (n > 0 ? 'pos' : (n < 0 ? 'neg' : '')) + '">' + esc(s) + '</span>'; };
    const colorize = function(s) {
      return esc(s).replace(/([+-][0-9]+(?:[.][0-9]+)?(?:%|元))/g, function(m) {
        return '<span class="' + (m.charAt(0) === '+' ? 'pos' : 'neg') + '">' + m + '</span>';
      });
    };
    function bar(n, max, isMain) {
      const width = Math.max(4, n / max * 100).toFixed(1);
      return '<div class="bar"><i style="width:' + width + '%;background:' + (isMain ? 'var(--orange)' : 'var(--blue)') + '"></i></div>';
    }
    function overviewCard(x) {
      return '<article class="overview-card"><h3>' + esc(x.name) + '</h3><div class="note">' + esc(x.note || '') + '</div>' +
        '<div class="hero-label">杯量</div><div class="hero-value">' + esc(x.cups) + '</div>' +
        '<div class="compare"><span>日 ' + change(x.day) + '</span><span>周 ' + change(x.week) + '</span><span>VS8月 ' + change(x.vs) + '</span></div>' +
        '<div class="mini-grid"><div class="mini"><strong>动销店日均 ' + esc(x.active) + '</strong>日 ' + change(x.activeDay) + '<br>周 ' + change(x.activeWeek) +
        '</div><div class="mini"><strong>日均动销门店 ' + esc(x.stores) + '</strong>日 ' + change(x.storesDay) + '<br>周 ' + change(x.storesWeek) + '</div></div>' +
        '<div class="metric-line"><strong>杯均实收 ' + esc(x.receipt) + '</strong>日 ' + change(x.receiptDay) + '　周 ' + change(x.receiptWeek) + '　VS8月 ' + change(x.receiptVs) + '</div></article>';
    }
    function summaryCard(name, item, isRegion) {
      const labels = isRegion ? ['大区整体：','下钻 A/B/C：'] : ['整体：','下钻 A/B/C：'];
      return '<article class="summary-card' + (isRegion ? ' region-card' : '') + '"><h3>' + esc(name) + '</h3>' +
        '<p><b>' + labels[0] + '</b>' + colorize(item.overall) + '</p>' +
        '<p><b>' + labels[1] + '</b>' + colorize(item.menus) + '</p></article>';
    }
    function channelTable(metric) {
      const max = Math.max.apply(null, metric.rows.reduce(function(a, r) { return a.concat([r[1][1], r[2][1]]); }, []));
      let h = '<div class="metric-block"><div class="metric-header">' + esc(metric.label) + '</div><table><colgroup>' +
        '<col style="width:15%"><col style="width:12%"><col style="width:25%"><col style="width:16%"><col style="width:16%">' +
        (metric.vs ? '<col style="width:16%">' : '') + '</colgroup><thead><tr><th>菜单</th><th>口径</th><th>数值</th><th>日环比</th><th>周同比</th>' +
        (metric.vs ? '<th>VS8月</th>' : '') + '</tr></thead><tbody>';
      metric.rows.forEach(function(row) {
        const menu = row[0], total = row[1], main = row[2];
        h += '<tr class="pair-start"><td rowspan="2" class="menu">' + esc(menu) + '</td><td class="scope">整体</td><td class="value">' + esc(total[0]) + bar(total[1], max, false) + '</td><td>' + change(total[2]) + '</td><td>' + change(total[3]) + '</td>' + (metric.vs ? '<td>' + change(total[4]) + '</td>' : '') + '</tr>';
        h += '<tr><td class="scope main">主站</td><td class="value">' + esc(main[0]) + bar(main[1], max, true) + '</td><td>' + change(main[2]) + '</td><td>' + change(main[3]) + '</td>' + (metric.vs ? '<td>' + change(main[4]) + '</td>' : '') + '</tr>';
      });
      return h + '</tbody></table></div>';
    }
    function regionTable(key, label, hasVs) {
      const values = REPORT_DATA.regionData.reduce(function(a, r) { return a.concat(r[key].map(function(x) { return x[2]; })); }, []);
      const max = Math.max.apply(null, values);
      const cols = hasVs
        ? '<col style="width:14%"><col style="width:14%"><col style="width:28%"><col style="width:14%"><col style="width:15%"><col style="width:15%">'
        : '<col style="width:15%"><col style="width:15%"><col style="width:30%"><col style="width:20%"><col style="width:20%">';
      let h = '<div class="region-metric metric-block region-table"><div class="metric-header">' + esc(label) + '</div><table><colgroup>' + cols + '</colgroup><thead><tr><th>大区</th><th>菜单</th><th>数值</th><th>日环比</th><th>周同比</th>' + (hasVs ? '<th>VS8月</th>' : '') + '</tr></thead><tbody>';
      REPORT_DATA.regionData.forEach(function(r) {
        r[key].forEach(function(v, i) {
          h += '<tr class="' + (i === 0 ? 'pair-start' : '') + '">' + (i === 0 ? '<td rowspan="4" class="region">' + esc(r.name) + '</td>' : '') +
            '<td class="menu">' + esc(v[0]) + '</td><td class="value">' + esc(v[1]) + bar(v[2], max, false) + '</td><td>' + change(v[3]) + '</td><td>' + change(v[4]) + '</td>' + (hasVs ? '<td>' + change(v[5]) + '</td>' : '') + '</tr>';
        });
      });
      return h + '</tbody></table></div>';
    }
    document.getElementById('overview').innerHTML = REPORT_DATA.overview.map(overviewCard).join('');
    document.getElementById('channel-summary').innerHTML = REPORT_DATA.channelData.map(function(c) { return summaryCard(c.name, REPORT_DATA.channelSummaries[c.name], false); }).join('');
    document.getElementById('channel-details').innerHTML = REPORT_DATA.channelData.map(function(c) {
      return '<section class="detail-channel"><div class="detail-heading"><h3>' + esc(c.name) + '</h3><span>先看整体，再看分菜单与主站</span></div>' + c.metrics.map(channelTable).join('') + '</section>';
    }).join('');
    document.getElementById('region-summary-cards').innerHTML = REPORT_DATA.regionData.map(function(r) { return summaryCard(r.name, REPORT_DATA.regionSummaries[r.name], true); }).join('');
    document.getElementById('region-details').innerHTML = regionTable('volume','杯量',true) + regionTable('receipt','杯均实收',true);

    function saveBlob(blob, filename) {
      var link = document.createElement('a');
      var url = URL.createObjectURL(blob);
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
    }

    function downloadHtml() {
      var content = '<!doctype html>\n' + document.documentElement.outerHTML;
      saveBlob(new Blob([content], {type:'text/html;charset=utf-8'}), '外卖新菜单经营日报_2026-09-09.html');
    }

    function pageStyleText() {
      return Array.prototype.map.call(document.querySelectorAll('style'), function(node) { return node.textContent; }).join('\n');
    }

    async function downloadImage() {
      var button = document.getElementById('download-image');
      var originalText = button.textContent;
      button.disabled = true;
      button.textContent = '正在生成…';
      try {
        if (document.fonts && document.fonts.ready) { await document.fonts.ready; }
        var target = document.querySelector('.page');
        var clone = target.cloneNode(true);
        var actions = clone.querySelector('.header-actions');
        if (actions) { actions.remove(); }
        var rect = target.getBoundingClientRect();
        var width = Math.ceil(rect.width);
        var height = Math.ceil(target.scrollHeight);
        var scale = Math.min(2, 16000 / Math.max(1, height), 8000 / Math.max(1, width));
        var markup = '<div xmlns="http://www.w3.org/1999/xhtml" class="export-surface"><style>' + pageStyleText() + '.export-surface{width:' + width + 'px;min-height:' + height + 'px;background:#f3f6f9;overflow:hidden;}</style>' + clone.outerHTML + '</div>';
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '"><foreignObject width="100%" height="100%">' + markup + '</foreignObject></svg>';
        var svgUrl = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml;charset=utf-8'}));
        var image = new Image();
        image.onload = function() {
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(width * scale));
          canvas.height = Math.max(1, Math.round(height * scale));
          var context = canvas.getContext('2d');
          context.fillStyle = '#f3f6f9';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.setTransform(scale, 0, 0, scale, 0, 0);
          context.drawImage(image, 0, 0);
          URL.revokeObjectURL(svgUrl);
          if (canvas.toBlob) {
            canvas.toBlob(function(blob) {
              if (!blob) {
                window.alert('图片导出失败，请使用 Chrome 或 Edge 后重试。');
                button.disabled = false;
                button.textContent = originalText;
                return;
              }
              saveBlob(blob, '外卖新菜单经营日报_2026-09-09.png');
              button.disabled = false;
              button.textContent = originalText;
            }, 'image/png');
          } else {
            var dataUrl = canvas.toDataURL('image/png');
            var link = document.createElement('a');
            link.href = dataUrl;
            link.download = '外卖新菜单经营日报_2026-09-09.png';
            link.click();
            button.disabled = false;
            button.textContent = originalText;
          }
        };
        image.onerror = function() {
          URL.revokeObjectURL(svgUrl);
          window.alert('图片导出失败，请使用 Chrome 或 Edge 后重试。');
          button.disabled = false;
          button.textContent = originalText;
        };
        image.src = svgUrl;
      } catch (error) {
        window.alert('图片导出失败，请使用 Chrome 或 Edge 后重试。');
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    document.getElementById('download-html').addEventListener('click', downloadHtml);
    document.getElementById('download-image').addEventListener('click', downloadImage);
  </script>
</body>
